<!DOCTYPE html>
<html>

<head>

<title>Payment Gateway - Brew Bliss Café</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7ede2;
}

header{
    background:#5C3317;
    color:white;
    text-align:center;
    padding:20px;
}

nav{
    margin-top:10px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-size:18px;
    font-weight:bold;
}

.payment-box{
    width:450px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

.payment-box h2{
    text-align:center;
    color:#5C3317;
}

label{
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:15px;
    border:1px solid gray;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#5C3317;
    color:white;
    border:none;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#7b4a27;
}

footer{
    background:#5C3317;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}

</style>

</head>

<body>

<header>

<h1>Brew Bliss Café</h1>

<nav>

<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="contact.html">Contact Us</a>
<a href="payment.html">Payment Gateway</a>
<a href="ssl.html">SSL</a>

</nav>

</header>

<div class="payment-box">

<h2>Payment Gateway</h2>

<form>

<label>Full Name</label>

<input type="text">

<label>Card Number</label>

<input type="text" placeholder="1234 5678 9012 3456">

<label>Expiry Date</label>

<input type="month">

<label>CVV</label>

<input type="password">

<label>Payment Method</label>

<select>

<option>Credit Card</option>

<option>Debit Card</option>

<option>UPI</option>

<option>Net Banking</option>

</select>

<button>Pay Now</button>

</form>

</div>

<footer>

<p>🔒 Secure Payment | Brew Bliss Café</p>

</footer>

</body>

</html>
